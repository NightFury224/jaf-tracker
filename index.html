<meta name="robots" content="noindex,nofollow">
<title>JAF Tracker Store</title>
<style>
/* Wide spreadsheet-style view: tabs on top, sticky header and first column, status as colored chips. */
:root{--bg:#f6f7f9;--panel:#ffffff;--fg:#1c2330;--muted:#5b6678;--line:#d8dde6;--accent:#1f3864;--head:#1f3864;--headfg:#ffffff;--ok-bg:#d5efdf;--ok-fg:#14633a;--warn-bg:#fbeec2;--warn-fg:#7a5200;--bad-bg:#f6d4d4;--bad-fg:#8a1f1f;--info-bg:#dbe6fb;--info-fg:#1f3f86;--row:#f0f2f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--panel:#1a202a;--fg:#e6e9ef;--muted:#9aa5b8;--line:#2a3140;--accent:#8fb0ee;--head:#26324a;--headfg:#e6e9ef;--ok-bg:#1d4a33;--ok-fg:#8fe0b0;--warn-bg:#4a3b12;--warn-fg:#f0cf7a;--bad-bg:#552525;--bad-fg:#f2a5a5;--info-bg:#223458;--info-fg:#a9c4f5;--row:#202737;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--panel:#1a202a;--fg:#e6e9ef;--muted:#9aa5b8;--line:#2a3140;--accent:#8fb0ee;--head:#26324a;--headfg:#e6e9ef;--ok-bg:#1d4a33;--ok-fg:#8fe0b0;--warn-bg:#4a3b12;--warn-fg:#f0cf7a;--bad-bg:#552525;--bad-fg:#f2a5a5;--info-bg:#223458;--info-fg:#a9c4f5;--row:#202737;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:20px}
main{display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
h1{font-size:1.4rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;line-height:1.5;margin:4px 0 0;max-width:80ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.85rem;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
td.fit{min-width:210px;max-width:340px}
td.fit .why{margin-top:5px;color:var(--muted,#666);font-size:12px;line-height:1.4;white-space:normal}
.tabs button[aria-selected="true"]{background:var(--head);color:var(--headfg);border-color:var(--head)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:75vh}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:.85rem;text-align:left;vertical-align:top;background:var(--panel)}
th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--headfg);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;z-index:1;min-width:170px;max-width:220px}
th:first-child{z-index:3}
tbody tr:nth-child(even) td{background:var(--row)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nowrap{white-space:nowrap}
td.long{min-width:320px;max-width:420px;line-height:1.45}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok-fg)}.warn{background:var(--warn-bg);color:var(--warn-fg)}.bad{background:var(--bad-bg);color:var(--bad-fg)}.info{background:var(--info-bg);color:var(--info-fg)}
a{color:var(--accent)}
.note{color:var(--muted);font-size:.8rem}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
</style>
<main>
<header>
<h1>Placement JAF Tracker</h1>
<p class="sub" id="meta">IIT Bombay placements 2026-27. Open and applied JAFs with pay, deadline, selection process and portal status. Scroll sideways for the rest; company and headers stay in place. This page re-reads the data every minute.</p>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="wrap" id="view"></div>
<p class="note" id="foot"></p>
</main>
<script>
var SNAP = {};
var DATA = SNAP;
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function parseDT(v){ if(v&&typeof v==="object"&&v.dt){var m=v.dt.match(/(\d+)-(\d+)-(\d+) (\d+):(\d+)/); return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);} return null; }
function fmt(v,withDay,withTime){ var d=parseDT(v); if(!d) return v==null?"":String(v);
  var s=(withDay?DAYS[d.getDay()]+", ":"")+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
  if(withTime){var h=d.getHours(),mm=("0"+d.getMinutes()).slice(-2),ap=h>=12?"PM":"AM";h=h%12||12;s+=" "+h+":"+mm+" "+ap;} return s; }
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function colLetter(n){return String.fromCharCode(64+n);}
function cell(sheet,coord){var c=DATA[sheet]&&DATA[sheet].cells; return c?c[coord]:undefined;}
function chipClass(txt){ if(!txt) return ""; var t=String(txt);
  if(/^Applied|Offer|Shortlisted|^P1$|^Yes$|^Strong$|^Mumbai\/Abroad$/.test(t)) return "ok";
  if(/Not applied|^P2$|Partial|Test|Interview|^Maharashtra$/.test(t)) return "warn";
  if(/Skip|Rejected|Closed|Weak/.test(t)) return "bad";
  return "info"; }
function chip(t){ if(!t) return ""; return '<span class="chip '+chipClass(t)+'">'+esc(t)+'</span>'; }
function trackerHTML(){
  if(!DATA["JAF Tracker"]) return "<p class='note' style='padding:16px'>Loading the tracker...</p>";
  var rule=function(a){var v=cell("JAF Tracker",a);return typeof v==="number"?v:null;};
  var pref=rule("B77")||2000000, floor=rule("B78")||1200000;
  var heads=[]; for(var c=1;c<=21;c++){ if(c===8||c===16) continue; heads.push(cell("JAF Tracker",colLetter(c)+"4")||"");}   // 8 = CTC (lakh), 16 = Selection process: both live on the Applied tab now
  var html="<table><thead><tr>"+heads.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr></thead><tbody>";
  var n=0;
  for(var r=5;r<=69;r++){
    if(!cell("JAF Tracker","A"+r)) continue; n++;
    var v=function(c){return cell("JAF Tracker",c+r);};
    var jid=(String(v("Q")||"").match(/job\/(\d+)/)||[])[1];
    var as=(DATA["assessments"]||{})[jid]||null;
    var ctc=typeof v("G")==="number"?v("G"):null;
    var lakh=ctc==null?"":(ctc/100000).toFixed(2);
    var top=(v("D")==="Mumbai/Abroad"||v("E")==="Strong"), mid=(top||v("D")==="Maharashtra"), pr="";
    if(ctc!=null){ pr = (ctc>=pref&&top)?"P1":((ctc>=pref||(ctc>=floor&&mid))?"P2":"P3"); }
    var link=v("Q")?'<a href="'+esc(v("Q"))+'" target="_blank" rel="noopener">Open job</a>':"";
    html+="<tr>"+
     "<td><strong>"+esc(v("A"))+"</strong></td>"+
     "<td class='long'>"+esc(v("B"))+"</td>"+
     "<td>"+esc(v("C"))+"</td>"+
     "<td>"+chip(v("D"))+"</td>"+
     "<td class='fit'>"+chip(v("E"))+(as&&as.why?"<div class='why'>"+esc(as.why)+"</div>":"")+"</td>"+
     "<td>"+chip(pr)+"</td>"+
     "<td class='num'>"+(ctc==null?"":ctc.toLocaleString("en-IN"))+"</td>"+
     "<td class='num'>"+(typeof v("I")==="number"?v("I").toLocaleString("en-IN"):"")+"</td>"+
     "<td class='nowrap'>"+fmt(v("J"),false,false)+"</td>"+
     "<td class='nowrap'><strong>"+fmt(v("K"),true,true)+"</strong></td>"+
     "<td>"+chip(v("L"))+"</td>"+
     "<td class='nowrap'>"+esc(v("M"))+"</td>"+
     "<td class='nowrap'>"+esc(v("N"))+"</td>"+
     "<td>"+esc(v("O"))+"</td>"+
     "<td>"+link+"</td>"+
     "<td class='long'>"+esc(v("R"))+"</td>"+
     "<td class='nowrap'>"+fmt(v("S"),false,true)+"</td>"+
     "<td>"+(v("T")?chip(v("T")):"")+"</td>"+
     "<td class='nowrap'>"+esc(v("U"))+"</td></tr>";
  }
  return html+"</tbody></table>";
}
function nrm(x){ return String(x||"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim(); }
function toks(x){ var o={},a=nrm(x).split(" ");
  for(var i=0;i<a.length;i++){ if(a[i].length>1&&a[i]!=="and"&&a[i]!=="the") o[a[i]]=1; } return o; }
function nkeys(o){ var n=0; for(var k in o) n++; return n; }
// Match an Applied row to its Tracker row. Portal titles drift between postings, so: exact normalised title,
// then, among that company's rows, word overlap - but only if every word of the SHORTER title appears in the
// longer one, and only if the best row beats the runner-up clearly. Tested against the 2024-25 and 2025-26
// placement blogs (191 real drifted titles): 1% wrong, the rest either right or deliberately blank.
function trackerRowFor(title,company){
  var t=(DATA["JAF Tracker"]||{}).cells||{}, wantT=nrm(title), wantC=nrm(company), rows=[], ex=[];
  for(var r=5;r<=69;r++){ if(t["A"+r]) rows.push(r); }
  // The exact-title shortcut is scoped to THIS COMPANY's rows (25 Oct 2026). It used to scan every
  // row, so two companies sharing a generic title knocked each other out: "Associate" is both
  // Strategy& and Alvarez & Marsal, "Analyst" is both o3 Capital and IQVIA, and all four rendered
  // a blank Role type and Portal link here - the page Ved opens before an interview. Only a repeat
  // WITHIN one company is genuinely undecidable. Keep in step with match() in tests/test_title_join.py.
  var mine=wantC?rows.filter(function(r){ var a=nrm(t["A"+r]); return a===wantC||a.indexOf(wantC)===0||wantC.indexOf(a)===0; }):[];
  var pool=mine.length?mine:rows;
  for(var i=0;i<pool.length;i++){ if(nrm(t["B"+pool[i]])===wantT) ex.push(pool[i]); }
  if(ex.length===1) return ex[0];
  if(ex.length>1) return null;                     // the same title twice at one company: cannot tell them apart
  if(!wantC) return null;
  var want=toks(title), nw=nkeys(want), scored=[];
  for(var k=0;k<mine.length;k++){
    var have=toks(t["B"+mine[k]]), nh=nkeys(have), hit=0, small=(nw<=nh)?want:have, big=(nw<=nh)?have:want, all=true;
    for(var w in want){ if(have[w]) hit++; }
    for(var q in small){ if(!big[q]){ all=false; break; } }
    if(nw&&nh) scored.push({sc:hit/Math.max(nw,nh), all:all, row:mine[k]});
  }
  if(!scored.length) return null;
  scored.sort(function(a,b){ return b.sc-a.sc; });
  var top=scored[0], second=scored.length>1?scored[1].sc:0;
  if(!top.all) return null;                        // a distinguishing word differs: Analytics vs Technology
  if(mine.length>1 && (top.sc-second)<0.2) return null;
  return top.row;
}
function appliedHTML(){
  var heads=["Company","Job code","Title","Role type","Signed on (IST)","Portal stage","Next step","Pipeline on portal","Resume on portal","Prep notes - and what to say","Projects they may ask about","Portal link","SOP","Type"];
  var html="<table><thead><tr>"+heads.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr></thead><tbody>";
  for(var r=5;r<=95;r++){ if(!cell("Applied (Portal)","A"+r)) continue; var v=function(c){return cell("Applied (Portal)",c+r);};
    var tr=trackerRowFor(v("C"),v("A")), tv=function(c){return tr?cell("JAF Tracker",c+tr):"";};
    var jl=tv("Q")?'<a href="'+esc(tv("Q"))+'" target="_blank" rel="noopener">Open job</a>':"";
    html+="<tr><td><strong>"+esc(v("A"))+"</strong></td><td>"+esc(v("B"))+"</td><td>"+esc(v("C"))+"</td>"+
     "<td>"+esc(tv("C"))+"</td>"+
     "<td class='nowrap'>"+fmt(v("D"),false,true)+"</td>"+
     "<td>"+chip(v("E"))+"</td>"+
     "<td>"+(v("L")&&v("L")!=="-"?chip(v("L")):"")+"</td>"+
     "<td class='long'>"+esc(v("F"))+"</td>"+
     "<td class='nowrap'>"+esc(v("G"))+"</td>"+
     "<td class='long'>"+esc(v("M"))+"</td>"+
     "<td class='long'>"+esc(v("N"))+"</td>"+
     "<td>"+jl+"</td><td>"+esc(v("H"))+"</td><td>"+esc(v("I"))+"</td></tr>"; }
  return html+"</tbody></table>";
}
function guideHTML(){
  var heads=[]; for(var c=1;c<=4;c++){heads.push(cell("Resume Guide",colLetter(c)+"3")||"");}
  var html="<table><thead><tr>"+heads.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr></thead><tbody>";
  for(var r=4;r<=12;r++){ if(!cell("Resume Guide","A"+r)) continue; var v=function(c){return cell("Resume Guide",c+r);};
    html+="<tr><td><strong>"+esc(v("A"))+"</strong></td><td class='long'>"+esc(v("B"))+"</td><td class='long'>"+esc(v("C"))+"</td><td class='long'>"+esc(v("D"))+"</td></tr>"; }
  return html+"</tbody></table>";
}
function budgetHTML(){
  if(!DATA["JAF Budget"]) return "<p class='note' style='padding:16px'>The budget tab has not been built yet (run jaf-budget.py).</p>";
  var v=function(c,r){return cell("JAF Budget",c+r);};
  var html="<p class='note' style='padding:12px 2px'>"+esc(v("A",1))+"<br>"+esc(v("A",2))+"</p>";
  html+="<table><thead><tr><th>"+esc(v("A",3))+"</th><th>"+esc(v("B",3))+"</th><th>"+esc(v("C",3))+"</th><th>"+esc(v("D",3))+"</th></tr></thead><tbody>";
  for(var r=4;r<=40;r++){ var a=v("A",r); if(!a) continue; if(!v("B",r)){ html+="<tr><td colspan='4' class='note'>"+esc(a)+"</td></tr>"; continue; }
    html+="<tr><td><strong>"+esc(a)+"</strong></td><td class='num'>"+esc(v("B",r))+"</td><td class='long'>"+esc(v("C",r))+"</td><td class='long'>"+esc(v("D",r))+"</td></tr>"; }
  return html+"</tbody></table>";
}
var TABS=[["Tracker",trackerHTML],["Applied (Portal)",appliedHTML],["Resume Guide",guideHTML],["JAF Budget",budgetHTML]], current=0;
function render(){
  var t=document.getElementById("tabs"); t.innerHTML="";
  TABS.forEach(function(x,i){var b=document.createElement("button"); b.id="tab"+i; b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",i===current); b.textContent=x[0]; b.onclick=function(){current=i;render();}; t.appendChild(b);});
  document.getElementById("view").innerHTML=TABS[current][1]();
  var a2=cell("Applied (Portal)","A2")||"";
  var note = current===0 ? "Priority and CTC in lakh are calculated from the CTC and the rules in the sheet (1st preference 20 lakh and above, 2nd 12 lakh and above, 3rd below 12 lakh). Times are IST." : (current===1 ? "Open this right before a test or interview: the next step, what the round looks like, and which resume they are holding." : (current===2 ? "A company's own page-length rule always overrides this table." : "Counted on the Pi from the blog and the tracker - no Claude, no credits. The opened-JAF figure is a floor; the full working is in VOLUME_PROJECTION_2026-10-28.md."));
  document.getElementById("foot").textContent = (note+" "+a2).trim();
}
var last=JSON.stringify(DATA);
function load(){
  fetch("tracker_cells.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d["JAF Tracker"]){var s=JSON.stringify(d); if(s!==last){last=s; DATA=d; render();}}
  }).catch(function(){});
}
render(); load(); setInterval(load,60000);
</script>
